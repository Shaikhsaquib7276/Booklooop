name: BookLoop Tests

on:
  push:
    branches:
      - "feature/smart-semester-book-finder"
  pull_request:
    branches:
      - "feature/smart-semester-book-finder"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
